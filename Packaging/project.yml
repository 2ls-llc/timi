# xcodegen spec — for anyone who wants an Xcode project for signing/debugging:
#   brew install xcodegen && xcodegen generate --spec Packaging/project.yml
# The canonical build stays `swift build` / Packaging/build.sh.
#
# Two targets mirror the SwiftPM layout: the app imports the TimiKit framework,
# matching the `import TimiKit` statements in Sources/Timi.
name: Timi
options:
  bundleIdPrefix: com.2ls
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  TimiKit:
    type: framework
    platform: macOS
    sources:
      - path: ../Sources/TimiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.2ls.timikit
  Timi:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/Timi
    dependencies:
      - target: TimiKit
        embed: true
      - package: KeyboardShortcuts
    info:
      path: Info.plist
    entitlements:
      path: Timi.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.2ls.timi
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
