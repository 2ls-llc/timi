name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      # Job-level: secrets can't appear in a step's `if`, and a step's own env
      # isn't visible to its `if` either.
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          swift --version

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        id: signing
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_CERT_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — will produce an ad-hoc build."
            exit 0
          fi
          KEYCHAIN=build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        run: ./Packaging/build.sh

      - name: Notarize
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: ./Packaging/notarize.sh

      - name: Package zip
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./Packaging/release.sh
          echo "sha256=$(cat dist/Timi-$VERSION.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          {
            echo 'Install with `brew install 2ls-llc/tap/timi`.'
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed and notarized build."
            else
              echo "This build isn't notarized by Apple yet, so macOS blocks its first launch."
              echo "Open Timi once and click **Done**, then go to **System Settings → Privacy & Security**"
              echo "and click **Open Anyway**. Each update needs this once more until releases are signed."
            fi
            echo
            echo "sha256: \`$SHA256\`"
          } > release-notes.md
          gh release create "v$VERSION" \
            "dist/Timi-$VERSION.zip" \
            --title "Timi $VERSION" \
            --notes-file release-notes.md

      - name: Open tap bump PR
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/2ls-llc/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks
          sed -e "s/^  version .*/  version \"$VERSION\"/" \
              -e "s/^  sha256 .*/  sha256 \"$SHA256\"/" \
              ../Packaging/homebrew/Casks/timi.rb > Casks/timi.rb
          BRANCH="timi-$VERSION"
          git checkout -b "$BRANCH"
          git add Casks/timi.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "timi $VERSION"
          git push origin "$BRANCH"
          GH_TOKEN=$TAP_TOKEN gh pr create --repo 2ls-llc/homebrew-tap \
            --head "$BRANCH" --title "timi $VERSION" \
            --body "Automated bump from the timi release workflow."
